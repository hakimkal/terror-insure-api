<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;1,600&display=swap" rel="stylesheet">

    <title>Ife</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            line-height: 1.5;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        a{
            text-decoration: none;
            color: white;
        }
        ul{
            list-style: none;
        }
        li{
            margin-bottom: 1.25rem;
        }
        .wrapper{
            padding: 0 .83rem;
        }
        .logo, .main, .bottom{
            margin-top: 8.3rem;
        }
        .space{
            margin-top: 4.17rem;
        }
        .main .space{
            font-size: 2.67rem;
        }
        .green{
            color: rgb(12, 139, 12);
            font-weight: 900;
        }
        .small{
            font-size: .75rem;
            font-weight: 600;
        }
        .bottom{
            border-top: 1px solid grey;
            padding: .83rem 0;
            font-size: .63rem;
            color: #1a1a1a;
        }
        h1, h2, h3 {
            color: #1a1a1a;
        }
        footer{
            background-color: rgb(12, 139, 12);
            color: #fff;
            padding: .83rem 0;
            margin-top: 3.1rem;
        }
        .footer-row{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .links a{
            margin-left: .83rem;
            padding: .83rem;
        }

        /* Button styles */
        .btn {
            background-color: rgb(12, 139, 12);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            margin: 0;
        }

        .btn:hover {
            background-color: #0a0a0a;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="overall">
        <h1>Welcome <b th:text="${name}"></b>!</h1>
        <h3>You are just a step away logging smartly, kindly click on the button
            verify your account</a> to explore.</h3>
        <h3>Thank you</h3>
        <h2>terror insure team</h2>
    </div>

    <div class="bottom">
        <!-- Replace anchor tags with buttons -->
        <a th:href="${link}" class="btn" style="color: white;">Verify Your Account</a>
    </div>
</div>

<footer>
    <div class="wrapper">
        <div class="footer-row">
            <!-- ... (existing content) ... -->
            <div class="links">
                <!-- Replace anchor tags with buttons -->
                <button class="btn" href="#">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- ... (your SVG path) ... -->
                    </svg>
                </button>
                <!-- ... (repeat for other buttons) ... -->
            </div>
        </div>

        <ul class="space">
            <li><button class="btn">Contact Support</button></li>
            <li><button class="btn">Privacy</button></li>
            <li><button class="btn">Terms</button></li>
        </ul>
    </div>
</footer>

</body>
</html>
